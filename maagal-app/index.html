<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F6E9E6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="מעגל">
<title>מעגל · ניהול מנטורינג</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet" crossorigin>
<style>
:root{
  --bg:#FAF6F3; --bg-2:#F4ECE7; --surface:#FFFFFF;
  --ink:#3B2B36; --ink-2:#5E4A57; --muted:#8C7A84;
  --line:#EADFD9; --line-2:#F3EBE6;
  --plum:#5E3B54; --plum-d:#4A2E42;
  --rose:#B9787F; --rose-d:#9C5E67; --rose-s:#F5E3E1;
  --gold:#B08D57; --gold-s:#F3EADB;
  --sage:#7E9A7E; --sage-s:#E6EEE4;
  --shadow:0 1px 2px rgba(94,59,84,.05),0 8px 26px rgba(94,59,84,.07);
  --r:18px;
  --serif:'Frank Ruhl Libre','David','Times New Roman',serif;
  --sans:'Assistant','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--rose-d)}
.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:28px 18px;background:linear-gradient(185deg,#F6E9E6 0%,#F2E7EC 55%,#EEE8F2 100%);border-inline-end:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:2px 10px 28px}
.brand h1{font-family:var(--serif);font-weight:500;font-size:31px;margin:0;color:var(--plum);line-height:1}
.brand p{margin:5px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.2px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:13px;color:var(--ink-2);text-decoration:none;font-weight:500;margin-bottom:4px;transition:background .15s,box-shadow .15s}
.nav a:hover{background:rgba(255,255,255,.6)}
.nav a.on{background:#fff;color:var(--plum);box-shadow:var(--shadow);font-weight:600}
.nav a.on .i{stroke:var(--rose)}
.nav .badge{margin-inline-start:auto;font-size:12px;background:rgba(94,59,84,.08);color:var(--ink-2);border-radius:99px;padding:0 8px}
.side-foot{position:absolute;bottom:22px;inset-inline:18px;font-size:12.5px;color:var(--muted);padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.5)}
.side-foot b{display:block;color:var(--plum);font-weight:600;font-size:13px;margin-bottom:2px}
.main{padding:36px 46px 70px;max-width:1260px;width:100%}

.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:26px;flex-wrap:wrap}
.ph h2{font-family:var(--serif);font-weight:500;font-size:36px;margin:0;color:var(--plum);line-height:1.15}
.ph .sub{color:var(--muted);margin-top:6px;max-width:640px}
.eyebrow{font-size:13px;color:var(--rose-d);font-weight:600;letter-spacing:.3px;margin-bottom:4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px}
.card h3,.sec{font-family:var(--serif);font-weight:500;font-size:20px;margin:0 0 14px;color:var(--plum);display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tight{gap:0 14px}
.mt{margin-top:16px}.mt0{margin-top:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.end{justify-content:flex-end}
.muted{color:var(--muted)}
.sm{font-size:13.5px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 20px;font-weight:600;cursor:pointer;background:var(--plum);color:#fff;transition:background .15s,transform .15s;text-decoration:none;white-space:nowrap;font-size:15px}
.btn:hover{background:var(--plum-d);transform:translateY(-1px)}
.btn.soft{background:var(--rose-s);color:var(--plum)}
.btn.soft:hover{background:#EFD5D2}
.btn.ghost{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--bg-2)}
.btn.danger{background:#F6E0E0;color:#963C47}
.btn.danger:hover{background:#F0CFD0}
.btn.sm{padding:6px 14px;font-size:13.5px}
.btn .i{width:17px;height:17px}
.f{width:100%;border:1px solid var(--line);background:#FFFCFB;border-radius:12px;padding:10px 14px;outline:none;transition:border-color .15s,box-shadow .15s}
.f:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(185,120,127,.14);background:#fff}
textarea.f{resize:vertical;min-height:110px;line-height:1.65}
textarea.big{min-height:240px}
select.f{cursor:pointer}
.l{display:block;font-size:13.5px;font-weight:600;color:var(--ink-2);margin:0 0 6px}
.l small{font-weight:400;color:var(--muted)}
.field{margin-bottom:14px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);cursor:pointer}
.chk input{accent-color:var(--rose-d);width:16px;height:16px}
.seg{display:inline-flex;background:var(--bg-2);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 15px;border-radius:999px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:14px}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(94,59,84,.12);color:var(--plum);font-weight:600}
.note{background:var(--gold-s);color:#6E5530;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:16px}
.note.ok{background:var(--sage-s);color:#456145}
.hint{font-size:13px;margin-top:6px;color:var(--muted)}
.hint.ok{color:#4F6B4F}
.link{border:0;background:none;color:var(--rose-d);cursor:pointer;padding:0;font-weight:600;font-size:13.5px}

/* ---------- tags ---------- */
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 11px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;line-height:1.7;border:1px solid transparent}
.tag.click,[data-act].tag{cursor:pointer}
.tag .x{border:0;background:none;padding:0 3px;margin-inline-start:2px;cursor:pointer;opacity:.5;font-size:16px;line-height:1;color:inherit}
.tag .x:hover{opacity:1}
.tag .cnt{font-style:normal;font-size:11.5px;opacity:.65;margin-inline-start:4px}
.tag.must{border-color:currentColor;font-weight:700}
.tag.miss{background:transparent!important;border:1px dashed #D9CBC5;color:var(--muted)!important}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.c-rose{background:#F5E3E1;color:#8E4D57}  .dot.c-rose{background:#C98E95}
.c-sage{background:#E5EDE3;color:#4F6B4F}  .dot.c-sage{background:#8FAA8D}
.c-gold{background:#F3EADB;color:#7E6235}  .dot.c-gold{background:#C2A574}
.c-lav{background:#ECE7F3;color:#5E4E7E}   .dot.c-lav{background:#A495C0}
.c-sky{background:#E2EBF1;color:#45657C}   .dot.c-sky{background:#8EABBF}
.c-peach{background:#F8E7DD;color:#8A5537} .dot.c-peach{background:#D8A585}
.c-mint{background:#DDEEEA;color:#3E6E64}  .dot.c-mint{background:#86B8AC}
.c-stone{background:#EEEAE7;color:#625A55} .dot.c-stone{background:#ABA29C}

.tp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);background:#FFFCFB;border-radius:12px;padding:6px 8px;min-height:44px;transition:border-color .15s,box-shadow .15s}
.tp:focus-within{border-color:var(--rose);box-shadow:0 0 0 4px rgba(185,120,127,.14);background:#fff}
.tp-wrap{position:relative;flex:1;min-width:170px}
.tp-in{border:0;outline:0;background:transparent;width:100%;padding:4px 6px}
.tp-dd{position:absolute;top:calc(100% + 8px);inset-inline-start:-8px;width:min(330px,80vw);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(59,43,54,.16);z-index:40;padding:6px;max-height:310px;overflow:auto}
.tp-opt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:14px}
.tp-opt small{margin-inline-start:auto;color:var(--muted);font-size:12px}
.tp-opt.hi{background:var(--bg-2)}
.tp-opt.create{color:var(--rose-d)}

/* ---------- avatars & kinds ---------- */
.av{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:15px;flex:none;letter-spacing:.5px}
.av.sm{width:34px;height:34px;font-size:13px}
.av.lg{width:68px;height:68px;font-size:23px;font-family:var(--serif);font-weight:500}
.kind{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.k-mentee{background:#F5E3E1;color:#8E4D57}
.k-mentor{background:#F3EADB;color:#7E6235}
.k-contact{background:#E2EBF1;color:#45657C}

/* ---------- dashboard ---------- */
.stat{position:relative;overflow:hidden}
.stat .n{font-family:var(--serif);font-size:42px;line-height:1;color:var(--plum)}
.stat .lbl{color:var(--muted);margin-top:8px;font-size:14px}
.stat::after{content:'';position:absolute;width:120px;height:120px;border-radius:50%;inset-inline-end:-38px;top:-44px;opacity:.55}
.stat.rose::after{background:var(--rose-s)} .stat.gold::after{background:var(--gold-s)}
.stat.sage::after{background:var(--sage-s)} .stat.lav::after{background:#ECE7F3}
.list .it{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid var(--line-2);cursor:pointer;border-radius:10px}
.list .it:last-child{border-bottom:0}
.list .it:hover{background:var(--bg)}
.list .it .grow{flex:1;min-width:0}
.list .it .t1{font-weight:600}
.list .it .t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap;background:var(--bg-2);color:var(--ink-2)}
.pill.late{background:#F6E0E0;color:#963C47}
.pill.today{background:var(--gold-s);color:#7E6235}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14.5px}

/* ---------- people ---------- */
.filters .search{flex:1;min-width:240px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:18px}
.pcard{cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;display:flex;flex-direction:column;gap:12px;padding:20px}
.pcard:hover{transform:translateY(-2px);border-color:#E7CFCB;box-shadow:0 2px 4px rgba(94,59,84,.05),0 14px 30px rgba(94,59,84,.10)}
.pcard .top{display:flex;gap:12px;align-items:center}
.pcard .who{flex:1;min-width:0}
.pcard .nm{font-weight:700;font-size:16.5px}
.pcard .rl{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:auto}
.pcard .meta .due{color:#963C47;font-weight:600}

/* ---------- person modal ---------- */
.phead{display:flex;gap:18px;align-items:center;margin-bottom:18px}
.phead h2{font-family:var(--serif);font-weight:500;font-size:30px;margin:0;color:var(--plum);line-height:1.1}
.phead .rl{color:var(--muted);margin-top:4px}
.contact{margin-top:8px;font-size:14px}
.contact a{display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:var(--ink-2);background:var(--bg-2);padding:3px 11px;border-radius:999px}
.contact a:hover{background:var(--rose-s)}
.contact .i{width:15px;height:15px}
.tl{position:relative;padding-inline-start:24px;margin-top:6px}
.tl::before{content:'';position:absolute;inset-inline-start:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tli{position:relative;margin-bottom:16px;background:var(--bg);border-radius:14px;padding:14px 16px}
.tli::before{content:'';position:absolute;inset-inline-start:-23px;top:19px;width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid var(--rose)}
.tl-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tl-h b{font-size:15.5px}
.tl-h .muted{font-size:13px}
.tl-h .del{margin-inline-start:auto}
.tli .txt{white-space:pre-wrap;color:var(--ink-2);font-size:14.5px;margin:8px 0;max-height:7.2em;overflow:hidden}
.tli.open .txt{max-height:none}
.atts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.atts img{width:84px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:8px;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--rose-s);color:#963C47}

/* ---------- intake ---------- */
.intake{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--rose-s);color:var(--rose-d);font-family:var(--sans);font-size:14px;font-weight:700}
.drop{border:1.5px dashed #DCC6C3;border-radius:16px;padding:20px;text-align:center;background:#FFFBFA;color:var(--muted);cursor:pointer;margin-top:14px;transition:background .15s,border-color .15s}
.drop:hover,.drop.over{border-color:var(--rose);background:var(--rose-s)}
.drop .i{width:28px;height:28px;stroke:var(--rose);margin-bottom:4px}
.drop b{color:var(--ink-2)}
.drop small{display:block;margin-top:6px;font-size:12.5px;line-height:1.6}
.files{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.fth{position:relative;width:132px;background:var(--bg);border-radius:12px;padding:6px;font-size:12px;color:var(--muted)}
.fth img{width:100%;height:78px;object-fit:cover;border-radius:8px;display:block}
.fth .fst{margin-top:5px;line-height:1.35}
.fth .x{position:absolute;top:2px;inset-inline-end:2px;width:22px;height:22px;border-radius:50%;border:0;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);cursor:pointer;line-height:1}
.bar{display:block;height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:4px}
.bar i{display:block;height:100%;background:var(--rose);width:0;transition:width .2s}
.howto{display:grid;gap:14px;margin:6px 0 20px}
.hstep{display:flex;gap:12px}
.hstep>span{width:38px;height:38px;border-radius:12px;background:var(--rose-s);color:var(--rose-d);display:grid;place-items:center;flex:none}
.hstep p{margin:2px 0 0;color:var(--muted);font-size:14px}

/* ---------- match ---------- */
.res{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:start;margin-top:14px;position:relative}
.res.best{border-color:#E7CFCB;background:linear-gradient(180deg,#FFFBFA,#fff)}
.ribbon{position:absolute;top:-11px;inset-inline-start:22px;background:var(--plum);color:#fff;font-size:12px;font-weight:600;border-radius:99px;padding:2px 12px}
.ring{--p:0;--rc:var(--rose);width:66px;height:66px;border-radius:50%;background:conic-gradient(var(--rc) calc(var(--p) * 1%),var(--bg-2) 0);display:grid;place-items:center}
.ring span{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:700;color:var(--plum);font-size:15px}
.res .nm{font-weight:700;font-size:17px}
.res .why{color:var(--ink-2);font-size:14px;margin:6px 0 10px}
.snip{margin-top:10px;font-size:14px;color:var(--ink-2);background:var(--bg);border-radius:12px;padding:9px 13px;border-inline-start:3px solid var(--rose-s)}
mark{background:#F6E3C8;color:inherit;border-radius:4px;padding:0 2px}
.acts{display:flex;flex-direction:column;gap:6px}
.ex .btn{font-weight:500}

/* ---------- modal & toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(59,43,54,.30);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;z-index:50;animation:fade .15s ease}
.modal{background:var(--surface);border-radius:22px;box-shadow:0 24px 70px rgba(59,43,54,.28);width:100%;max-width:560px;padding:30px;position:relative;animation:pop .18s ease}
.modal.wide{max-width:840px}
.modal.img{max-width:min(1100px,94vw);padding:12px}
.modal.img img{width:100%;border-radius:14px;display:block}
.modal .close{position:absolute;top:14px;inset-inline-end:14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--bg-2);cursor:pointer;font-size:20px;line-height:1;color:var(--ink-2);z-index:2}
.modal .close:hover{background:var(--rose-s)}
.mh{font-family:var(--serif);font-weight:500;font-size:26px;margin:0 0 18px;color:var(--plum)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
#toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);background:var(--plum);color:#fff;padding:11px 22px;border-radius:18px;box-shadow:0 10px 30px rgba(59,43,54,.3);opacity:0;pointer-events:none;transition:.25s;z-index:80;font-weight:500;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- AI & app bits ---------- */
.nav .lbl-s{display:none}
.btn:disabled{opacity:.6;cursor:default;transform:none}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid currentColor;border-inline-end-color:transparent;display:inline-block;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-note{background:linear-gradient(135deg,#FBF1EE,#F3ECF6);border-color:#EBDCE3;color:var(--ink-2)}
.gaps{margin-top:8px;font-size:13.5px;color:#7E6235;background:var(--gold-s);border-radius:10px;padding:6px 11px}
.res.out{opacity:.72}
.sug{border:1px dashed #D9B9B5;background:transparent;color:var(--rose-d);border-radius:999px;padding:2px 11px;font-size:13px;cursor:pointer;margin-inline-start:6px}
.sug:hover{background:var(--rose-s)}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .intake,.g2{grid-template-columns:minmax(0,1fr)}
  .main{padding:28px 26px 60px}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .main{min-width:0}
  .tag{white-space:normal}
  .side{min-width:0;position:sticky;top:0;height:auto;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;z-index:30;border-inline-end:0;border-bottom:1px solid var(--line)}
  .brand{padding:0}.brand h1{font-size:24px}.brand p{display:none}.brand svg{width:30px;height:30px}
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:space-around;gap:2px;background:rgba(255,252,251,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .nav a{flex:1;min-width:0;flex-direction:column;gap:2px;margin:0;padding:6px 2px;font-size:11.5px;border-radius:12px;text-align:center}
  .nav a:hover{background:transparent}
  .nav a.on{background:var(--rose-s);box-shadow:none;color:var(--plum)}
  .nav .i{width:21px;height:21px}
  .nav .lbl{display:none}.nav .lbl-s{display:block}
  .nav .badge{display:none}
  .side-foot{display:none}
  .main{padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
  #toast{bottom:calc(86px + env(safe-area-inset-bottom))}

  set(k, v) { return new Promise(res => { try { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); } }); },

        ? `<div class="tp-opt${i === hi ? ' hi' : ''}" data-i="${i}"><span class="dot c-${catOf(it.t.cat).color}"></span>#${esc(it.t.label)}<small>${esc(catOf(it.t.cat).name)}</small></div>`

const STOP = new Set('של את על עם זה זו זאת היא הוא אני אתה יש אין לא כן גם או כי אם מה כל אבל רק עוד היה היתה הייתה להיות לה לו אצל אשר שלה שלו שלי אנחנו הם הן בין כמו אחרי לפני מאוד יותר פחות דרוש דרושה דרושים דרושות משרה משרת לתפקיד תפקיד ניסיון יתרון חובה עבודה חברה חברת לחברת בחברת כולל וכן אנו מחפשים מחפשת מחפש תחום בתחום שנים שנות לפחות עם ידע היכרות רצון יכולת מישהי מישהו שלנו אותה אותו לנו לי the and of to a in for with on is are be as at by or an'.split(' '));

  properties: { person_name: STR, kind: { type: 'string', enum: ['mentee', 'mentor', 'contact'] }, role: STR, company: STR, phone: STR, email: STR,
    meeting_date: STR, follow_up_date: STR, title: STR, summary: STR, image_text: STR,
    tag_ids: { type: 'array', items: STR }, new_tags: { type: 'array', items: STR } } };
const INTAKE_SYSTEM = `You work inside a private mentoring CRM used by a finance mentor in Israel. She logs her meetings with mentees, mentors and professional contacts from the accounting and finance world, and later searches these records to match people to job openings and to each other. A record that is accurate and well tagged is what makes those matches work.

You receive the raw material of one meeting: pasted notes, an email, a WhatsApp message, a transcript and/or screenshots. Turn it into one clean record about the other person in the meeting (never about the mentor herself).

Use only what the material says. When the material does not state something, return an empty string for that field rather than guessing, because the mentor trusts these records when she recommends people.

Fields:
- person_name, role, company, phone, email: the other person's details. Write role and company in Hebrew unless they are proper names in English.
- kind: "mentee" for someone she guides or helps find work, "mentor" for a senior person who guides others, "contact" for recruiters, employers and other professional contacts.
- meeting_date: YYYY-MM-DD if the material states or clearly implies the date, otherwise empty.
- follow_up_date: YYYY-MM-DD only when a concrete follow-up moment is stated (for example "send it by Sunday"), otherwise empty.
- title: a short Hebrew title for the meeting, up to six words.
- summary: Hebrew, three to six short lines in the mentor's own voice (first person, feminine): who the person is professionally, what they are looking for, what was agreed, and next steps.
- image_text: a faithful transcription of all the text in the attached images, in its original language. Empty when there are no images.
- tag_ids: every tag from the library below that the material clearly supports. Return the ids exactly as written. Map cities to their region tag (for example Netanya belongs to the Sharon region).
- new_tags: up to three short Hebrew tag names for an important attribute the library lacks. Usually this is an empty list.`;
const MATCH_SCHEMA = { type: 'object', additionalProperties: false, required: ['overview', 'ranking'],
  properties: { overview: STR, ranking: { type: 'array', items: { type: 'object', additionalProperties: false, required: ['id', 'score', 'reason', 'gaps'],
    properties: { id: STR, score: { type: 'integer' }, reason: STR, gaps: STR } } } } };
const MATCH_SYSTEM = `You help a finance mentor in Israel decide who in her private network best fits a request. The request is usually a job description she received, sometimes a few words about the kind of person she is looking for (for example a mentor for one of her mentees). The candidates come from her own CRM and were pre-selected by a keyword search, so some of them will not really fit.

Judge fit by meaning rather than word overlap: someone who ran month-end closing at a software company fits a "high-tech bookkeeper" role even if the words differ. Weigh the role and seniority asked for, hard requirements, location and work mode, availability, and anything in the meeting notes about what the person wants. She will pass your ranking on to recruiters, so a confident recommendation needs evidence in the profile.

Return:
- ranking: the candidates worth considering, best first. Leave out anyone who clearly does not fit. For each one: id exactly as given; score from 0 to 100 for the fit as a whole; reason, one or two Hebrew sentences she could say out loud, naming concrete evidence from the profile; gaps, in Hebrew, what is missing or should be checked with the person, or an empty string.
- overview: one Hebrew sentence on the overall picture, for example that there are two strong options and the rest are partial.

Use only the information provided, and write all free text in Hebrew.`;
const isISO = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '') && !!mkDate(+s.slice(0, 4), +s.slice(5, 7), +s.slice(8, 10));

function initials(n) { const p = String(n || '?').trim().split(/\s+/); return (p[0]?.[0] || '') + (p[1]?.[0] || ''); }
function avatar(p, size = '') { let h = 0; for (const c of p.name || '') h = (h * 31 + c.charCodeAt(0)) >>> 0; const [bg, fg] = AV[h % AV.length]; return `<span class="av ${size}" style="background:${bg};color:${fg}">${esc(initials(p.name))}</span>`; }
const kindPill = k => `<span class="kind ${KINDS[k]?.cls || ''}">${KINDS[k]?.label || ''}</span>`;
const kindOpts = sel => Object.entries(KINDS).map(([k, v]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${v.label}</option>`).join('');
const digits = s => String(s || '').replace(/[^\d+]/g, '');
const normPhone = s => { let d = String(s || '').replace(/\D/g, ''); if (d.startsWith('972')) d = '0' + d.slice(3); return d; };
function followPill(iso) {
  if (!iso) return '';
  const d = dayDiff(iso);
  if (d > 0) return `<span class="pill late">באיחור · ${d === 1 ? 'יום' : d + ' ימים'}</span>`;
  if (d === 0) return '<span class="pill today">היום</span>';
  return `<span class="pill">${relDate(iso)}</span>`;
}

function openModal(html, { wide = false, stack = false, cls = '' } = {}) {
  if (!stack) closeAll();
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal${wide ? ' wide' : ''} ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener('mousedown', e => { if (e.target === bg) closeTop(); });
  $('#modal-root').appendChild(bg);
  document.body.classList.add('noscroll');
  return $('.modal', bg);
}
function afterModalsClosed() { document.body.classList.remove('noscroll'); if (DIRTY) { DIRTY = false; render(); } }
function closeTop() { const r = $('#modal-root'); if (!r.lastElementChild) return; r.lastElementChild.remove(); if (!r.children.length) afterModalsClosed(); }
function closeAll() { const r = $('#modal-root'); if (!r.children.length) return; r.innerHTML = ''; afterModalsClosed(); }
function confirmBox(msg, ok = 'מחיקה') {
  return new Promise(res => {
    const m = openModal(`<h3 class="mh" style="font-size:22px">${msg}</h3><div class="row end"><button class="btn ghost" data-c="0">ביטול</button><button class="btn danger" data-c="1">${ok}</button></div>`, { stack: true });
    $$('[data-c]', m).forEach(b => b.onclick = () => { closeTop(); res(b.dataset.c === '1'); });
  });
}

function drawPeople() {

    if (P.kind !== 'all' && p.kind !== P.kind) return false;
    if (P.tags.some(t => !p.tags.includes(t))) return false;
    if (!qw.length) return true;
    const hay = normText([p.name, p.role, p.company, p.notes, p.email, p.tags.map(id => TAGMAP.get(id)?.label).join(' '), meetingsOf(p.id).map(m => m.title + ' ' + m.text).join(' ')].join(' '));

async function matchAI(btn) {
  // The AI re-ranks the keyword search's top candidates; each profile carries the person's notes and recent meetings.
  const res = runMatch(M.q, M.sel, M.kind).slice(0, 12);
  if (!res.length) { toast('אין מועמדים לדירוג'); return; }
  const done = busy(btn, 'ה-AI קורא את הפרופילים…');
  try {
    const cut = (s, n) => s.length > n ? s.slice(0, n) + '…' : s;
    const profiles = res.map(({ p }) => {
      const ms = meetingsOf(p.id).slice(0, 6);
      return `[id: ${p.id}] ${p.name} | ${KINDS[p.kind]?.label || ''} | ${p.role || '-'} | ${p.company || '-'}
Tags: ${sortTags(p.tags).map(id => TAGMAP.get(id).label).join(', ') || '-'}
Notes: ${p.notes || '-'}
Meetings (newest first):
${ms.map(m => `- ${m.date} · ${m.title}: ${cut(m.text, 3000)}`).join('\n') || '-'}`;
    }).join('\n\n---\n\n');
    const must = M.sel.filter(x => x.must).map(x => TAGMAP.get(x.id)?.label).filter(Boolean);
    const r = await aiJSON({ system: MATCH_SYSTEM, schema: MATCH_SCHEMA, format: MATCH_FORMAT, effort: 'medium',
      text: `Request:\n${M.q.trim()}\n${must.length ? `\nShe marked these as hard requirements: ${must.join(', ')}\n` : ''}\nToday's date: ${todayISO()}\n\nCandidates (${res.length}):\n\n${profiles}` });
    const ids = new Set(res.map(x => x.p.id));
    M.ai = { overview: typeof r.overview === 'string' ? r.overview : '',
      ranking: (Array.isArray(r.ranking) ? r.ranking : []).filter(a => a && ids.has(a.id)).map(a => ({ id: a.id, score: Math.max(0, Math.min(100, Math.round(+a.score || 0))), reason: String(a.reason || ''), gaps: String(a.gaps || '') })) };
    drawMatch();
  } catch (e) { console.error(e); toast(e.message || 'משהו השתבש בדירוג', 6000); }
  finally { done(); }
}

    // Capabilities the Claude viewer grants this page; each one resolves null where it is not available.
    const [db, user, sample, downloads] = await Promise.all(['db', 'user', 'sample', 'downloads'].map(n => Promise.resolve().then(() => window.claude.use(n)).catch(() => null)));
    SAMPLE = sample || null; DOWNLOADS = downloads || null;
    if (SAMPLE) SAMPLE_LIM = await SAMPLE.limits().catch(() => null);
    if (db && user) { try { await cloudOpen(db, user); } catch (e) { console.error(e); CLOUD = null; } }
  }
  if (CLOUD) { if (!PENDING_SAVE) $('#savestate').textContent = 'נשמר ומסונכרן בחשבון שלך'; }
  else await bootLocal();
  updateNavBadges();
  render(hashRoute());
  if (HOSTED && !CLOUD) toast('המידע נשמר כרגע רק במכשיר הזה. פרטים במסך ההגדרות.', 6000);
}
async function bootLocal() {

  if (ai && typeof ai.key === 'string') AI = { key: ai.key, model: AI_MODELS.some(m => m[0] === ai.model) ? ai.model : AI.model };

  const fresh = !st || !Array.isArray(st.tags);
  S = fresh ? freshState(!HOSTED) : st;   // sample people are pre-loaded only outside an artifact; there the dashboard offers them
  reindexTags();
  if (ok) { if (fresh) save(); else $('#savestate').textContent = 'כל השינויים נשמרו במכשיר'; }
  else { $('#savestate').textContent = 'הדפדפן חוסם שמירה מקומית'; toast('שימי לב: הדפדפן לא מאפשר שמירה – כדאי לפתוח בדפדפן רגיל (Chrome / Edge)'); }
}
